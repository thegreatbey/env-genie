name: env-lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint .env and produce SARIF
        run: node dist/cli.js --sarif env-genie.sarif --exit-zero
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: env-genie.sarif